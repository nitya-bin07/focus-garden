<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Tree • Focus Garden</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230e1712%27/%3E%3Cpath d=%27M16 6 10 18h3l-4 8h14l-4-8h3z%27 fill=%27%238fe3a8%27/%3E%3C/svg%3E" />
  <style>
    .app-container { padding-bottom: 6rem; }

    .shop-header {
      text-align: center;
      width: 100%;
    }

    .coin-display {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 1rem 0.4rem 0.4rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--amber);
      margin-bottom: 0.6rem;
    }

    .coin-display .coin-circle { width: 22px; height: 22px; font-size: 0.7rem; }

    .shop-subtitle { font-size: 0.78rem; color: var(--text-muted); }

    .tree-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
      margin-top: 0.4rem;
    }

    .tree-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 1.1rem 0.4rem 0.8rem;
      font-size: 1.9rem;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .tree-card:hover:not(:disabled) {
      transform: translateY(-3px) rotate(-1.5deg);
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .tree-card:nth-child(2n):hover:not(:disabled) {
      transform: translateY(-3px) rotate(1.5deg);
    }

    .tree-card.active {
      background: linear-gradient(180deg, var(--glow-soft), var(--surface));
      border-color: var(--glow);
      box-shadow: 0 0 16px var(--glow-soft);
    }

    .tree-card.locked { opacity: 0.65; }

    .tree-card.locked:hover {
      transform: translateY(-3px);
      border-color: rgba(232, 185, 114, 0.4);
    }

    .tree-name {
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-weight: 600;
      font-family: var(--font-body);
    }

    .price-badge {
      font-size: 0.65rem;
      background: var(--amber-soft);
      border: 1px solid rgba(232, 185, 114, 0.35);
      color: var(--amber);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      font-family: var(--font-mono);
    }

    .owned-badge {
      font-size: 0.6rem;
      background: var(--surface-strong);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
    }

    .selected-badge {
      font-size: 0.6rem;
      background: var(--glow-soft);
      border: 1px solid var(--glow);
      color: var(--glow);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      font-weight: 700;
    }

    .lock-icon {
      position: absolute;
      top: 0.45rem;
      right: 0.55rem;
      font-size: 0.68rem;
      opacity: 0.65;
    }

    .status-text {
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
    }
  </style>
</head>

<body>
  <div id="toast" class="toast hidden"></div>

  <main class="app-container">
    <header class="app-header">
      <h1>Tree Shop</h1>
      <p>Spend coins to unlock new trees</p>
    </header>

    <div class="shop-header">
      <div class="coin-display">
        <div class="coin-circle">🪙</div>
        <span id="coin-count">0</span> coins
      </div>
      <p class="shop-subtitle">Earn 1 coin per 15 min of focus</p>
    </div>

    <section class="tree-grid" id="tree-grid"></section>

    <p class="status-text" id="status-text">Tap a locked tree to unlock it</p>
  </main>

  <nav class="app-nav">
    <a href="index.html"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.4"/><circle cx="9" cy="9" r="2.7"/></svg><span>Focus</span></a>
    <a href="trees.html" class="active"><svg viewBox="0 0 18 18"><path d="M9 15V9"/><path d="M9 9C9 9 5.8 8.8 5.8 5.2C9 5.2 9 9 9 9Z"/><path d="M9 9C9 9 12.2 8.8 12.2 5.2C9 5.2 9 9 9 9Z"/></svg><span>Trees</span></a>
    <a href="forest.html"><svg viewBox="0 0 18 18"><path d="M5 13 7.3 6.5 9.6 13Z"/><path d="M8.4 14 11.4 5 14.4 14Z"/></svg><span>Forest</span></a>
    <a href="history.html"><svg viewBox="0 0 18 18"><path d="M3.5 14.5H14.5"/><path d="M5.5 14.5V10"/><path d="M9 14.5V5.5"/><path d="M12.5 14.5V8.5"/></svg><span>History</span></a>
  </nav>

  <script>
    const TREES = [
      { id: "oak",    emoji: "🌳", name: "Oak",    price: 0  },
      { id: "pine",   emoji: "🌲", name: "Pine",   price: 0  },
      { id: "cherry", emoji: "🌸", name: "Cherry", price: 0  },
      { id: "palm",   emoji: "🌴", name: "Palm",   price: 5  },
      { id: "cactus", emoji: "🌵", name: "Cactus", price: 5  },
      { id: "maple",  emoji: "🍁", name: "Maple",  price: 8  },
      { id: "bamboo", emoji: "🎋", name: "Bamboo", price: 10 },
      { id: "bonsai", emoji: "🪴", name: "Bonsai", price: 12 },
    ];

    function getCoins() {
      return Number(localStorage.getItem("coins")) || 0;
    }

    function getUnlockedTrees() {
      return JSON.parse(localStorage.getItem("unlockedTrees")) || ["oak", "pine", "cherry"];
    }

    function saveUnlockedTrees(list) {
      localStorage.setItem("unlockedTrees", JSON.stringify(list));
    }

    function getSelectedTree() {
      return localStorage.getItem("selectedTree") || "oak";
    }

    function updateCoinDisplay() {
      document.getElementById("coin-count").textContent = getCoins();
    }

    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function renderTrees() {
      const grid = document.getElementById("tree-grid");
      grid.innerHTML = "";

      const unlocked = getUnlockedTrees();
      const selected = getSelectedTree();

      TREES.forEach(tree => {
        const isUnlocked = unlocked.includes(tree.id);
        const isSelected = selected === tree.id;

        const btn = document.createElement("button");
        btn.className = "tree-card";
        if (!isUnlocked) btn.classList.add("locked");
        if (isSelected) btn.classList.add("active");

        if (!isUnlocked) {
          const lockEl = document.createElement("span");
          lockEl.className = "lock-icon";
          lockEl.textContent = "🔒";
          btn.appendChild(lockEl);
        }

        const emojiEl = document.createElement("span");
        emojiEl.textContent = tree.emoji;
        btn.appendChild(emojiEl);

        const nameEl = document.createElement("span");
        nameEl.className = "tree-name";
        nameEl.textContent = tree.name;
        btn.appendChild(nameEl);

        const badge = document.createElement("span");
        if (isSelected) {
          badge.className = "selected-badge";
          badge.textContent = "✓ Selected";
        } else if (isUnlocked) {
          badge.className = "owned-badge";
          badge.textContent = "Owned";
        } else {
          badge.className = "price-badge";
          badge.textContent = `🪙 ${tree.price}`;
        }
        btn.appendChild(badge);

        btn.addEventListener("click", () => handleTreeClick(tree));
        grid.appendChild(btn);
      });
    }

    function handleTreeClick(tree) {
      const unlocked = getUnlockedTrees();

      if (unlocked.includes(tree.id)) {
        localStorage.setItem("selectedTree", tree.id);
        renderTrees();
        showToast(`${tree.name} selected! ${tree.emoji}`, "success");
        document.getElementById("status-text").textContent =
          `${tree.emoji} ${tree.name} will grow in your next session`;
        return;
      }

      if (getCoins() < tree.price) {
        showToast(`Need ${tree.price} coins to unlock ${tree.name} 🪙`, "error");
        return;
      }

      const remaining = getCoins() - tree.price;
      localStorage.setItem("coins", remaining);

      unlocked.push(tree.id);
      saveUnlockedTrees(unlocked);

      localStorage.setItem("selectedTree", tree.id);

      updateCoinDisplay();
      renderTrees();

      showToast(`${tree.name} unlocked! ${tree.emoji}`, "success");
      document.getElementById("status-text").textContent =
        `${tree.emoji} ${tree.name} unlocked and selected!`;
    }

    updateCoinDisplay();
    renderTrees();

    const selected = getSelectedTree();
    const selectedTree = TREES.find(t => t.id === selected);
    if (selectedTree) {
      document.getElementById("status-text").textContent =
        `${selectedTree.emoji} ${selectedTree.name} will grow in your next session`;
    }
  </script>
</body>
</html>
