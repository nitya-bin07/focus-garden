<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History • Focus Garden</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230e1712%27/%3E%3Cpath d=%27M16 6 10 18h3l-4 8h14l-4-8h3z%27 fill=%27%238fe3a8%27/%3E%3C/svg%3E" />
  <style>
    .page-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 1.5rem 1.3rem 6.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .streak-banner {
      background: linear-gradient(135deg, var(--glow-soft), rgba(143, 227, 168, 0.03));
      border: 1px solid rgba(143, 227, 168, 0.25);
      border-radius: var(--r-lg);
      padding: 1.1rem 1.4rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .streak-item { text-align: center; }
    .streak-val { font-size: 2rem; font-weight: 600; color: var(--glow); display: block; font-family: var(--font-display); }
    .streak-label { font-size: 0.66rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .streak-divider { width: 1px; height: 40px; background: var(--border); }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 0.9rem 0.6rem;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
    }

    body.history-loaded .summary-card {
      animation: fadeUp 0.45s ease forwards;
    }

    body.history-loaded .summary-card:nth-child(2) { animation-delay: 0.06s; }
    body.history-loaded .summary-card:nth-child(3) { animation-delay: 0.12s; }
    body.history-loaded .summary-card:nth-child(4) { animation-delay: 0.18s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .summary-card .val { font-size: 1.35rem; font-weight: 600; color: var(--glow); display: block; font-family: var(--font-display); }
    .summary-card .lbl { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.2rem; display: block; }
    .summary-card.wide { grid-column: span 3; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.1rem; }
    .summary-card.wide .lbl { margin: 0; }
    .summary-card.wide .val { font-size: 1.05rem; }

    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 1.15rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .section-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; }

    .nav-label { font-size: 0.72rem; color: var(--text-muted); font-family: var(--font-mono); }

    .heatmap-scroll { overflow-x: auto; padding-bottom: 0.3rem; }
    .heatmap-inner { display: inline-flex; flex-direction: column; min-width: 100%; }

    .heatmap-months {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 12px;
      column-gap: 3px;
      margin-left: 26px;
      margin-bottom: 4px;
      font-size: 0.58rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    .heatmap-body { display: flex; gap: 4px; }

    .heatmap-daylabels {
      display: grid;
      grid-template-rows: repeat(7, 12px);
      row-gap: 3px;
      width: 22px;
      flex-shrink: 0;
    }

    .heatmap-daylabels span {
      font-size: 0.55rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      font-family: var(--font-mono);
    }

    .heatmap-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 12px;
      grid-template-rows: repeat(7, 12px);
      gap: 3px;
    }


    .hm-cell { width: 12px; height: 12px; border-radius: 3px; background: rgba(159, 196, 164, 0.05); border: 1px solid rgba(159, 196, 164, 0.06); cursor: default; transition: transform 0.1s ease; position: relative; }
    .hm-cell:hover { transform: scale(1.5); z-index: 10; }
    .hm-cell.l0 { background: rgba(159, 196, 164, 0.05); }
    .hm-cell.l1 { background: #1c3324; }
    .hm-cell.l2 { background: #2f5c3c; }
    .hm-cell.l3 { background: #4c9764; }
    .hm-cell.l4 { background: var(--glow); box-shadow: 0 0 6px var(--glow-soft); }
    .hm-cell.today { outline: 2px solid var(--glow); outline-offset: 1px; }
    .hm-cell.filler { background: transparent; border-color: transparent; }
    .hm-cell[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; bottom: 135%; left: 50%; transform: translateX(-50%);
      background: var(--bg-canopy-1); border: 1px solid var(--border);
      color: var(--text-primary); font-size: 0.6rem; font-family: var(--font-body);
      white-space: nowrap; padding: 0.25rem 0.55rem;
      border-radius: var(--r-sm); pointer-events: none; z-index: 100;
    }

    .heatmap-legend { display: flex; align-items: center; gap: 0.3rem; margin-top: 0.7rem; justify-content: flex-end; }
    .legend-label { font-size: 0.6rem; color: var(--text-muted); }
    .legend-cell { width: 10px; height: 10px; border-radius: 2px; }

    .bar-chart { display: flex; align-items: flex-end; gap: 0.3rem; height: 190px; width: 100%; }
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
    .bar { width: 100%; background: linear-gradient(180deg, var(--fern), rgba(124, 179, 137, 0.25)); border-radius: 4px 4px 0 0; min-height: 3px; animation: growBar 0.5s ease-out; transform-origin: bottom; }
    .bar.today-bar { background: linear-gradient(180deg, var(--glow), var(--fern)); }
    .bar-lbl { font-size: 0.58rem; color: var(--text-muted); font-family: var(--font-mono); }
    @keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    .empty-msg { text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1.2rem 0; }

    .insight-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0; border-bottom: 1px solid var(--border); }
    .insight-row:last-child { border-bottom: none; }
    .insight-icon { font-size: 1.1rem; }
    .insight-text { font-size: 0.8rem; color: var(--text-secondary); }

    /* ACHIEVEMENTS */
    .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.55rem; }

    .badge {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.7rem 0.3rem;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--surface);
      text-align: center;
    }

    .badge .b-icon { font-size: 1.4rem; }
    .badge .b-name { font-size: 0.58rem; color: var(--text-secondary); font-weight: 600; line-height: 1.2; }

    .badge.locked { opacity: 0.35; filter: grayscale(100%); }

    .badge.unlocked {
      border-color: var(--glow);
      box-shadow: 0 0 10px var(--glow-soft);
      background: linear-gradient(180deg, var(--glow-soft), var(--surface));
    }

    .badge.unlocked .b-name { color: var(--glow); }

    .badge[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 108%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-canopy-1);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 0.62rem;
      font-family: var(--font-body);
      white-space: normal;
      width: 130px;
      padding: 0.4rem 0.5rem;
      border-radius: var(--r-sm);
      pointer-events: none;
      z-index: 60;
      text-align: center;
      line-height: 1.3;
    }

    /* FOCUS DISCIPLINE */
    .discipline-summary { display: flex; gap: 0.55rem; margin-bottom: 0.9rem; }

    .discipline-stat {
      flex: 1;
      text-align: center;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 0.6rem 0.4rem;
    }

    .discipline-stat .dv { font-size: 1.2rem; font-weight: 600; color: var(--glow); display: block; font-family: var(--font-display); }
    .discipline-stat .dl { font-size: 0.56rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

    .violation-log { display: flex; flex-direction: column; gap: 0.5rem; max-height: 230px; overflow-y: auto; }

    .violation-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.65rem;
      border-radius: var(--r-sm);
      background: var(--surface-strong);
      border: 1px solid var(--border);
      font-size: 0.76rem;
    }

    .violation-row.failed { border-color: rgba(226, 120, 106, 0.35); }
    .violation-row.warning { border-color: rgba(232, 185, 114, 0.3); }
    .violation-row .v-icon { font-size: 0.9rem; }
    .violation-row .v-text { flex: 1; color: var(--text-secondary); }
    .violation-row .v-time { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.66rem; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="page-container">
    <header class="app-header">
      <h1>Focus History</h1>
      <p>Your focus patterns & insights</p>
    </header>

    <div class="streak-banner">
      <div class="streak-item">
        <span class="streak-val" id="current-streak">—</span>
        <span class="streak-label">🔥 Current Streak</span>
      </div>
      <div class="streak-divider"></div>
      <div class="streak-item">
        <span class="streak-val" id="best-streak">—</span>
        <span class="streak-label">🏆 Best Streak</span>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-card"><span class="val" id="total-focus-time">—</span><span class="lbl">Focus Time</span></div>
      <div class="summary-card"><span class="val" id="total-sessions">—</span><span class="lbl">Sessions</span></div>
      <div class="summary-card"><span class="val" id="total-trees">—</span><span class="lbl">Trees 🌳</span></div>
      <div class="summary-card wide"><span class="lbl">Top Category</span><span class="val" id="top-category">—</span></div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <span class="section-title">Focus Heatmap</span>
        <span class="nav-label" id="nav-label">—</span>
      </div>
      <div class="heatmap-scroll themed-scroll" id="heatmap-scroll">
        <div class="heatmap-inner">
          <div class="heatmap-months" id="heatmap-months"></div>
          <div class="heatmap-body">
            <div class="heatmap-daylabels">
              <span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span>
            </div>
            <div class="heatmap-grid" id="heatmap-grid"></div>
          </div>
        </div>
      </div>
      <div class="heatmap-legend">
        <span class="legend-label">Less</span>
        <div class="legend-cell" style="background: rgba(159,196,164,0.05); border: 1px solid rgba(159,196,164,0.1)"></div>
        <div class="legend-cell" style="background: #1c3324"></div>
        <div class="legend-cell" style="background: #2f5c3c"></div>
        <div class="legend-cell" style="background: #4c9764"></div>
        <div class="legend-cell" style="background: #8fe3a8"></div>
        <span class="legend-label">More</span>
      </div>
    </div>

    <div class="section-card">
      <p class="section-title" style="margin-bottom:0.9rem">Last 7 Days</p>
      <div id="weekly-bars" class="bar-chart"></div>
    </div>

    <div class="section-card">
      <p class="section-title" style="margin-bottom:0.8rem">Insights</p>
      <div class="insight-row"><span class="insight-icon">📅</span><span class="insight-text" id="top-day">Most focused day: —</span></div>
      <div class="insight-row"><span class="insight-icon">⏰</span><span class="insight-text" id="top-hour">Most focused hour: —</span></div>
    </div>

    <div class="section-card">
      <p class="section-title" style="margin-bottom:0.9rem">Achievements</p>
      <div class="badge-grid" id="badge-grid"></div>
    </div>

    <div class="section-card">
      <p class="section-title" style="margin-bottom:0.9rem">Focus Discipline</p>
      <div class="discipline-summary" id="discipline-summary"></div>
      <div class="violation-log themed-scroll" id="violation-log"></div>
    </div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.4"/><circle cx="9" cy="9" r="2.7"/></svg><span>Focus</span></a>
    <a href="trees.html"><svg viewBox="0 0 18 18"><path d="M9 15V9"/><path d="M9 9C9 9 5.8 8.8 5.8 5.2C9 5.2 9 9 9 9Z"/><path d="M9 9C9 9 12.2 8.8 12.2 5.2C9 5.2 9 9 9 9Z"/></svg><span>Trees</span></a>
    <a href="forest.html"><svg viewBox="0 0 18 18"><path d="M5 13 7.3 6.5 9.6 13Z"/><path d="M8.4 14 11.4 5 14.4 14Z"/></svg><span>Forest</span></a>
    <a href="history.html" class="active"><svg viewBox="0 0 18 18"><path d="M3.5 14.5H14.5"/><path d="M5.5 14.5V10"/><path d="M9 14.5V5.5"/><path d="M12.5 14.5V8.5"/></svg><span>History</span></a>
  </nav>

  <script src="./js/history.js"></script>
</body>
</html>
