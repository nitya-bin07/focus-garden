<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Forest • Focus Garden</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230e1712%27/%3E%3Cpath d=%27M16 6 10 18h3l-4 8h14l-4-8h3z%27 fill=%27%238fe3a8%27/%3E%3C/svg%3E" />
  <style>
    .page { max-width: 480px; margin: 0 auto; padding: 1.5rem 1.3rem 6.5rem; }

    .forest-header { text-align: center; margin-bottom: 1rem; }
    .forest-header p { font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.3rem; }

    /* STATS ROW */
    .forest-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin: 0 0 1.1rem;
    }

    .stat-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 0.85rem 0.5rem;
      text-align: center;
    }

    .stat-pill .sv {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--glow);
      display: block;
      font-family: var(--font-display);
    }

    .stat-pill .sl {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 0.15rem;
      display: block;
    }

    /* FILTER TABS */
    .filter-row { display: flex; gap: 0.4rem; margin-bottom: 1.1rem; flex-wrap: wrap; }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.32rem 0.85rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s ease;
    }

    .filter-btn.active {
      background: var(--glow-soft);
      border-color: var(--glow);
      color: var(--glow);
      font-weight: 700;
    }

    /* FOREST GRID */
    .forest-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    .tree-tile {
      aspect-ratio: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      position: relative;
      animation: popIn 0.3s ease backwards;
    }

    .tree-tile:hover {
      transform: translateY(-3px) scale(1.05) rotate(-2deg);
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .tree-tile:nth-child(2n):hover {
      transform: translateY(-3px) scale(1.05) rotate(2deg);
    }

    .tree-tile .t-emoji { font-size: 1.8rem; line-height: 1; }
    .tree-tile .t-dur { font-size: 0.58rem; color: var(--text-muted); font-weight: 500; font-family: var(--font-mono); }

    .tree-tile .t-dot {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    .tree-tile[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 108%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-canopy-1);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 0.62rem;
      font-family: var(--font-body);
      white-space: nowrap;
      padding: 0.32rem 0.65rem;
      border-radius: var(--r-sm);
      pointer-events: none;
      z-index: 50;
    }

    /* EMPTY STATE */
    .empty-forest { grid-column: span 4; text-align: center; padding: 3rem 1rem; }
    .empty-forest .e-icon { font-size: 3rem; opacity: 0.4; display: block; margin-bottom: 0.6rem; }
    .empty-forest p { font-size: 0.85rem; color: var(--text-muted); }

    /* CATEGORY COLOR MAP — muted, botanical hues, each still distinguishable */
    .cat-study      { background: #7fb2d9; }
    .cat-coding     { background: #b79ee8; }
    .cat-reading    { background: #e8b972; }
    .cat-workout    { background: #e2786a; }
    .cat-meditation { background: #f0d189; }
    .cat-work       { background: #8fe3a8; }
    .cat-creative   { background: #e79bb8; }
    .cat-other      { background: #7d8f80; }
  </style>
</head>
<body>
  <main class="page">
    <header class="forest-header app-header">
      <h1>Your Forest</h1>
      <p>Every session grows a tree 🌱</p>
    </header>

    <!-- STATS -->
    <div class="forest-stats">
      <div class="stat-pill">
        <span class="sv" id="stat-trees">0</span>
        <span class="sl">Trees</span>
      </div>
      <div class="stat-pill">
        <span class="sv" id="stat-hours">0</span>
        <span class="sl">Hours</span>
      </div>
      <div class="stat-pill">
        <span class="sv" id="stat-streak">0</span>
        <span class="sl">🔥 Streak</span>
      </div>
    </div>

    <!-- FILTER -->
    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
    </div>

    <!-- GRID -->
    <div class="forest-grid" id="forest-grid"></div>
  </main>

  <nav class="app-nav">
    <a href="index.html"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.4"/><circle cx="9" cy="9" r="2.7"/></svg><span>Focus</span></a>
    <a href="trees.html"><svg viewBox="0 0 18 18"><path d="M9 15V9"/><path d="M9 9C9 9 5.8 8.8 5.8 5.2C9 5.2 9 9 9 9Z"/><path d="M9 9C9 9 12.2 8.8 12.2 5.2C9 5.2 9 9 9 9Z"/></svg><span>Trees</span></a>
    <a href="forest.html" class="active"><svg viewBox="0 0 18 18"><path d="M5 13 7.3 6.5 9.6 13Z"/><path d="M8.4 14 11.4 5 14.4 14Z"/></svg><span>Forest</span></a>
    <a href="history.html"><svg viewBox="0 0 18 18"><path d="M3.5 14.5H14.5"/><path d="M5.5 14.5V10"/><path d="M9 14.5V5.5"/><path d="M12.5 14.5V8.5"/></svg><span>History</span></a>
  </nav>

  <script>
    const TREE_EMOJIS = { oak:"🌳", pine:"🌲", cherry:"🌸", palm:"🌴", cactus:"🌵", maple:"🍁", bamboo:"🎋", bonsai:"🪴" };
    const CAT_CLASS = { study:"cat-study", coding:"cat-coding", reading:"cat-reading", workout:"cat-workout", meditation:"cat-meditation", work:"cat-work", creative:"cat-creative" };

    const sessions = JSON.parse(localStorage.getItem("focusSessions")) || [];
    const successful = sessions.filter(s => s.success);

    // STATS
    const totalMins = successful.reduce((s, x) => s + x.duration, 0);
    document.getElementById("stat-trees").textContent = successful.length;
    document.getElementById("stat-hours").textContent = (totalMins / 60).toFixed(1);

    // streak
    const today = new Date(); today.setHours(0,0,0,0);
    const uniqueDays = [...new Set(successful.map(s => s.date))].sort();
    const dayDates = uniqueDays.map(d => { const dt = new Date(d); dt.setHours(0,0,0,0); return dt; });
    let streak = 0, sd = new Date(today);
    for (let i = dayDates.length - 1; i >= 0; i--) {
      const diff = Math.floor((sd - dayDates[i]) / 86400000);
      if (diff === 0 || diff === 1) { streak++; sd = new Date(dayDates[i]); } else break;
    }
    document.getElementById("stat-streak").textContent = streak || "—";

    // FILTER BUTTONS — build from unique categories
    const categories = [...new Set(successful.map(s => s.category).filter(Boolean))];
    const filterRow = document.getElementById("filter-row");
    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = "filter-btn";
      btn.dataset.filter = cat.toLowerCase();
      btn.textContent = cat;
      btn.onclick = () => setFilter(cat.toLowerCase(), btn);
      filterRow.appendChild(btn);
    });

    let activeFilter = "all";
    function setFilter(f, btn) {
      activeFilter = f;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById("forest-grid");
      grid.innerHTML = "";

      const filtered = activeFilter === "all"
        ? successful
        : successful.filter(s => (s.category || "").toLowerCase() === activeFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-forest">
            <span class="e-icon">🌱</span>
            <p>No trees yet. Start focusing!</p>
          </div>`;
        return;
      }

      // newest first
      [...filtered].reverse().forEach((s, i) => {
        const tile = document.createElement("div");
        tile.className = "tree-tile";
        tile.style.animationDelay = `${i * 0.04}s`;

        const catKey = (s.category || "other").toLowerCase();
        const dotClass = CAT_CLASS[catKey] || "cat-other";

        tile.setAttribute("data-tip", `${s.date} · ${s.duration}min · ${s.category || "—"}${s.note ? " · " + s.note : ""}`);
        tile.innerHTML = `
          <div class="t-dot ${dotClass}"></div>
          <span class="t-emoji">${TREE_EMOJIS[s.treeType] || "🌳"}</span>
          <span class="t-dur">${s.duration}m</span>
        `;
        grid.appendChild(tile);
      });
    }

    renderGrid();
  </script>
</body>
</html>
