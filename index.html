<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Garden</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230e1712%27/%3E%3Cpath d=%27M16 6 10 18h3l-4 8h14l-4-8h3z%27 fill=%27%238fe3a8%27/%3E%3C/svg%3E" />
  <style>
    /* ── Page-specific: session note modal ── */
    .note-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 6, 0.75);
      backdrop-filter: blur(3px);
      z-index: 998;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    .note-modal.open { display: flex; }

    .note-modal-card {
      background: linear-gradient(180deg, var(--bg-canopy-1), var(--bg-canopy-2));
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 1.5rem;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      box-shadow: var(--shadow-deep);
    }

    .note-modal-card .headline {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--glow);
    }

    .note-modal-card .subhead {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .note-modal-card textarea {
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 0.7rem;
      color: var(--text-primary);
      font-size: 0.82rem;
      font-family: var(--font-body);
      resize: none;
      height: 80px;
      outline: none;
    }

    .note-modal-card textarea:focus { border-color: var(--border-strong); }

    .note-modal-actions { display: flex; gap: 0.6rem; }

    #note-skip-btn {
      flex: 1;
      background: var(--surface-strong);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 0.6rem;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-body);
    }

    #note-save-btn {
      flex: 2;
      background: linear-gradient(135deg, var(--glow), var(--fern));
      border: none;
      border-radius: var(--r-sm);
      padding: 0.6rem;
      color: #08130c;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: var(--font-body);
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <div id="toast" class="toast hidden"></div>

  <!-- COIN -->
  <div class="coin-badge">
    <div class="coin-circle">🪙</div>
    <span class="coin-count">0</span>
  </div>

  <main class="app-container">

    <!-- HEADER -->
    <header class="app-header">
      <h1>Focus Garden</h1>
      <p>Grow focus. Kill distraction.</p>
    </header>

    <!-- TIMER CARD -->
    <div class="timer-card">
      <div class="timer-wrapper">
        <svg class="progress-ring" width="180" height="180">
          <circle class="progress-ring-bg" stroke-width="8" fill="transparent" r="80" cx="90" cy="90"/>
          <circle class="progress-ring-fill" stroke-width="8" fill="transparent" r="80" cx="90" cy="90"/>
        </svg>
        <div class="timer-display ring-timer">15:00</div>
      </div>

      <input type="number" id="minutes-input" min="15" max="240" step="15" value="15"/>

      <div class="preset-buttons">
        <button data-min="15">15</button>
        <button data-min="30">30</button>
        <button data-min="45">45</button>
        <button data-min="60">60</button>
        <button data-min="90">90</button>
        <button data-min="120">120</button>
        <button data-min="240">240</button>
      </div>

      <p class="warning-message"></p>

      <div class="controls">
        <button id="start-btn">Start Focus</button>
        <button id="reset-btn" disabled>Reset</button>
      </div>
    </div>

    <!-- PLANT -->
    <div class="plant-card">
      <span id="plant" class="plant seed">🌰</span>
      <p class="plant-status">Start focusing to grow your plant</p>
    </div>

    <!-- SETTINGS ROW — 3 quick access buttons -->
    <div class="settings-row">
      <button id="btn-mode" onclick="togglePanel('mode-panel')">
        <span class="icon">🎯</span>
        <span>Focus Mode</span>
      </button>
      <button id="btn-category" onclick="togglePanel('category-panel')">
        <span class="icon">📂</span>
        <span>Category</span>
      </button>
      <button id="choose-tree-btn">
        <span class="icon">🌱</span>
        <span id="current-tree-name">Choose Tree</span>
      </button>
    </div>

    <!-- FOCUS MODE PANEL -->
    <div class="settings-panel" id="mode-panel">
      <h3>Focus Mode</h3>
      <div class="focus-mode">
        <label class="mode-option">
          <input type="radio" name="focus-mode" value="offscreen" checked />
          🌿 Off-Screen (No tab switching)
        </label>
        <label class="mode-option">
          <input type="radio" name="focus-mode" value="onscreen" />
          💻 On-Screen (Tabs allowed)
        </label>
      </div>
    </div>

    <!-- CATEGORY PANEL -->
    <div class="settings-panel" id="category-panel">
      <h3>Category</h3>
      <select id="category-select" class="category-select">
        <option value="">Select category</option>
      </select>
      <div class="category-actions">
        <button class="cat-btn" id="add-category-btn">➕ Add</button>
        <button class="cat-btn danger" id="delete-category-btn">🗑 Delete</button>
      </div>
    </div>

  </main>

  <!-- SESSION NOTE MODAL -->
  <div id="note-modal" class="note-modal">
    <div class="note-modal-card">
      <p class="headline">🌳 Session Complete!</p>
      <p class="subhead">What did you accomplish this session?</p>
      <textarea id="session-note-input" placeholder="e.g. Finished chapter 3, built the timer feature..."></textarea>
      <div class="note-modal-actions">
        <button id="note-skip-btn">Skip</button>
        <button id="note-save-btn">Save Note ✓</button>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <nav class="app-nav">
    <a href="index.html" class="active"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.4"/><circle cx="9" cy="9" r="2.7"/></svg><span>Focus</span></a>
    <a href="trees.html"><svg viewBox="0 0 18 18"><path d="M9 15V9"/><path d="M9 9C9 9 5.8 8.8 5.8 5.2C9 5.2 9 9 9 9Z"/><path d="M9 9C9 9 12.2 8.8 12.2 5.2C9 5.2 9 9 9 9Z"/></svg><span>Trees</span></a>
    <a href="forest.html"><svg viewBox="0 0 18 18"><path d="M5 13 7.3 6.5 9.6 13Z"/><path d="M8.4 14 11.4 5 14.4 14Z"/></svg><span>Forest</span></a>
    <a href="history.html"><svg viewBox="0 0 18 18"><path d="M3.5 14.5H14.5"/><path d="M5.5 14.5V10"/><path d="M9 14.5V5.5"/><path d="M12.5 14.5V8.5"/></svg><span>History</span></a>
  </nav>

  <script>
    function togglePanel(id) {
      const panel = document.getElementById(id);
      const isOpen = panel.classList.contains("open");
      // close all panels first
      document.querySelectorAll(".settings-panel").forEach(p => p.classList.remove("open"));
      // open if it wasn't open
      if (!isOpen) panel.classList.add("open");
    }

    function showNoteModal() {
      const modal = document.getElementById("note-modal");
      modal.classList.add("open");
      document.getElementById("session-note-input").value = "";
      document.getElementById("session-note-input").focus();
    }

    function closeNoteModal(saveNote) {
      const modal = document.getElementById("note-modal");
      modal.classList.remove("open");

      if (saveNote) {
        const note = document.getElementById("session-note-input").value.trim();
        if (note) {
          // attach note to the last saved session
          const sessions = JSON.parse(localStorage.getItem("focusSessions")) || [];
          if (sessions.length > 0) {
            sessions[sessions.length - 1].note = note;
            localStorage.setItem("focusSessions", JSON.stringify(sessions));
          }
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("note-save-btn").addEventListener("click", () => closeNoteModal(true));
      document.getElementById("note-skip-btn").addEventListener("click", () => closeNoteModal(false));
    });

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const pieces = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: Math.random() * 10 + 5,
        h: Math.random() * 5 + 3,
        color: ["#8fe3a8","#7cb389","#e8b972","#c9a5e8","#79b8d9","#e79bb8"][Math.floor(Math.random()*6)],
        speed: Math.random() * 4 + 2,
        angle: Math.random() * 360,
        spin: Math.random() * 4 - 2,
        drift: Math.random() * 2 - 1
      }));
      let frame, elapsed = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        elapsed++;
        pieces.forEach(p => {
          p.y += p.speed; p.x += p.drift; p.angle += p.spin;
          ctx.save(); ctx.translate(p.x, p.y);
          ctx.rotate((p.angle * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        });
        if (elapsed < 180) { frame = requestAnimationFrame(draw); }
        else { ctx.clearRect(0,0,canvas.width,canvas.height); cancelAnimationFrame(frame); }
      }
      draw();
    }
  </script>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
